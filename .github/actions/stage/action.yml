name: stage
description: Build one dependency-ordered group of aports with build.sh and hand the result on as an artifact
inputs:
  arch:
    required: true
  platform:
    description: Docker platform (linux/386, linux/arm64, ...)
    required: true
  qemu:
    required: true
  stage:
    description: Stage name, e.g. s3
    required: true
  prev:
    description: Previous stage name, empty for the first
    required: false
    default: ''
  pkgs:
    description: Space-separated aports to build, in dependency order
    required: true
  seed:
    description: Restore prebuilt gcc packages (tools/seed-restore.sh) before building
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - id: env
      uses: ./.github/actions/docker-env
      with:
        arch: ${{ inputs.arch }}
        qemu: ${{ inputs.qemu }}
    - shell: bash
      run: mkdir -p .work
    # Resume: a rerun of this stage starts from its own earlier (possibly
    # partial) artifact; otherwise from the previous stage's.  build.sh skips
    # every package whose inputs are unchanged, so either way only the missing
    # work is redone.
    - id: own
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: work-${{ inputs.arch }}-${{ inputs.stage }}
        path: .work
    - if: steps.own.outcome != 'success' && inputs.prev != ''
      uses: actions/download-artifact@v4
      with:
        name: work-${{ inputs.arch }}-${{ inputs.prev }}
        path: .work
    # The first stage of a fresh run starts from the newest cache saved by an
    # earlier run of this architecture (see the save-cache job in build-arch.yml),
    # so only what changed since then is rebuilt.  The dirty list is per run.
    - if: steps.own.outcome != 'success' && inputs.prev == ''
      uses: actions/cache/restore@v4
      with:
        path: .work
        key: work-${{ inputs.arch }}-${{ github.run_id }}-restore
        restore-keys: work-${{ inputs.arch }}-
    - if: steps.own.outcome != 'success' && inputs.prev == ''
      shell: bash
      run: rm -f .work/dirty
    - if: inputs.seed == 'true'
      shell: bash
      run: tools/seed-restore.sh "${{ inputs.arch }}"
    # A package interrupted by an earlier job left its build tree packed in
    # .work/partial/: put it back (here, natively; build.sh may run under QEMU).
    - name: Unpack build trees saved by an earlier job
      shell: bash
      run: |
        shopt -s nullglob
        for f in .work/partial/*.tar.zst; do
          p=$(basename "$f" .tar.zst)
          echo "unpacking the saved build tree of $p ($(du -h "$f" | cut -f1))"
          mkdir -p "testing/$p"
          zstd -dc "$f" | sudo tar -C "testing/$p" -xpf -
        done
    - name: Build (abuild runs each aport's check())
      shell: bash
      env:
        PKGS: ${{ inputs.pkgs }}
        DOCKER_PLATFORM: ${{ inputs.platform }}
        BUILD_IMAGE: ${{ steps.env.outputs.image }}
        CASCADE: "1"
        RUN_TAG: ${{ github.run_id }}
      run: |
        export KEYDIR="$PWD/.work/keys"
                # Nothing new is started after 4h15m; HARD is just before GitHub kills the
        # job (a killed job uploads nothing, so its work would be lost).
        # Emulated architectures compile serially: parallel emulated compilers just
        # exhaust the (emulated) memory and get OOM-killed.
        if [ "${{ inputs.qemu }}" = true ]; then export JOBS=1; fi
        export DEADLINE_EPOCH=$(( $(date +%s) + 255 * 60 ))
        export HARD_EPOCH=$(( $(date +%s) + 345 * 60 ))
        # A package still building at 5h25m is interrupted and its build tree saved
        # (build.sh run_abuild), to be continued by the next job.
        PM=325
        export PARTIAL_DEADLINE_EPOCH=$(( $(date +%s) + PM * 60 ))
        # Test hook: .github/ci-test-partial holds "<stage> <seconds>" or "<stage> step:<name>"; on the first
        # attempt of that stage every package build is interrupted that many seconds
        # after it starts, so the resume can be tested quickly.
        if [ -f .github/ci-test-partial ] && [ "$(cut -d' ' -f1 .github/ci-test-partial)" = "${{ inputs.stage }}" ] \
           && [ "${{ github.run_attempt }}" = 1 ]; then
          arg=$(cut -d' ' -f2 .github/ci-test-partial)
          case "$arg" in
            step:*) export PARTIAL_AFTER_STEP="${arg#step:}" ;;
            *)      export PARTIAL_AFTER_SECONDS="$arg" ;;
          esac
        fi
        set -o pipefail
        ./build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
    # Job logs need a login to read, but annotations are public: surface the
    # tail of the build log there so a failure can be diagnosed from the API.
    - if: failure()
      shell: bash
      run: |
        msg=$(tail -n 40 "$RUNNER_TEMP/build.log" 2>/dev/null | cut -c1-160 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=build log tail (${{ inputs.arch }} ${{ inputs.stage }})::$msg"
        # failed tests of a testsuite, by name
        ft=$(grep -E '^(INFO +)?(FAIL|ERROR|XPASS) ' "$RUNNER_TEMP/build.log" 2>/dev/null | grep -v PASS | head -20 | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        [ -n "$ft" ] && echo "::error title=failed tests (${{ inputs.arch }} ${{ inputs.stage }})::$ft"
        # the tail is often repeats of one error: also show the first error with its lead-up
        first=$(grep -n -m1 -E '^error: |: error: |^>>> ERROR|^make: \*\*\*|^Traceback|Segmentation|SIGSEGV|raised [A-Z][A-Z_]+|Killed|core dumped|Illegal instruction|Bus error' "$RUNNER_TEMP/build.log" 2>/dev/null | cut -d: -f1)
        if [ -n "$first" ]; then
          from=$(( first > 30 ? first - 30 : 1 ))
          msg=$(sed -n "${from},$((first + 10))p" "$RUNNER_TEMP/build.log" | cut -c1-200 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=first error (${{ inputs.arch }} ${{ inputs.stage }})::$msg"
        fi
    # Stop a build container left running by a cancelled or killed job, then undo build.sh's
    # chown of the checkout to the container's build user.
    - if: always()
      shell: bash
      run: |
        docker ps -q | xargs -r docker kill || true
        sudo chown -R "$(id -u):$(id -g)" . || true
    # Evidence for the multi-job resume (annotations are readable without a login).
    - name: Resume report
      if: always()
      shell: bash
      run: |
        log="$RUNNER_TEMP/build.log"
        [ -f "$log" ] || exit 0
        resumed=$(grep -c 'resuming the saved build tree' "$log" || true)
        interrupted=$(grep -cE 'out of time during|test hook: stopping' "$log" || true)
        units=$(grep -cE '^ *\[Ada\] ' "$log" || true)
        gens=$(grep -c 'Generating source for' "$log" || true)
        echo "::notice title=resume report (${{ inputs.arch }} ${{ inputs.stage }})::resumed=$resumed interrupted=$interrupted ada_units_compiled=$units generator_runs=$gens"
    # Pack the build trees of packages that build.sh interrupted (marker
    # .pending), on the runner at native speed.
    - name: Pack build trees of interrupted packages
      if: always()
      shell: bash
      run: |
        shopt -s nullglob
        for f in .work/partial/*.pending; do
          p=$(basename "$f" .pending)
          (cd "testing/$p" && tar -cf - $(ls -d src pkg tmp 2>/dev/null)) | zstd -T0 -3 -q -f -o ".work/partial/$p.tar.zst"
          rm -f "$f"
          echo "packed the build tree of $p: $(du -h ".work/partial/$p.tar.zst" | cut -f1)"
        done
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: work-${{ inputs.arch }}-${{ inputs.stage }}
        path: .work
        include-hidden-files: true
        overwrite: true
        retention-days: 3
        compression-level: 1
        if-no-files-found: ignore
    # The stage ran out of time between packages: fail the job so later stages
    # do not start, and leave a marker for ci-resume.yml, which reruns it.
    - id: inc
      if: always()
      shell: bash
      run: |
        if [ -e .work/incomplete ]; then echo "incomplete=true" >> "$GITHUB_OUTPUT"; fi
    - if: always() && steps.inc.outputs.incomplete == 'true'
      shell: bash
      run: echo "stage ${{ inputs.stage }} (${{ inputs.arch }}) incomplete" > "$RUNNER_TEMP/incomplete"
    - if: always() && steps.inc.outputs.incomplete == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: incomplete-${{ inputs.arch }}-${{ inputs.stage }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/incomplete
        retention-days: 3
    - if: always() && steps.inc.outputs.incomplete == 'true'
      shell: bash
      run: |
        echo "::warning title=checkpoint::stage ${{ inputs.stage }} (${{ inputs.arch }}) ran out of time; it will be rerun to resume"
        exit 1
