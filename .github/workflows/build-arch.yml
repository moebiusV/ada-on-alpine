# Build and test every aport (except the disabled gpr2-tools) for one
# architecture.  The dependency chain is too long for one 6-hour job, so it runs
# as sequential stages; each stage uploads .work (packages, hashes, the CI-only
# signing key) as an artifact that the next stage downloads.  Rerunning a failed
# stage resumes from its own partial artifact.  No timeouts of our own are set
# (GitHub's hosted runners still end a job at 6 h; only a self-hosted runner has
# no limit).  abuild runs every aport's
# check(), then a final job installs the lot into a clean container.
name: build-arch

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      qemu:
        type: boolean
        required: true

jobs:
  # abuild first, on every architecture: it carries the stack-clash fix that
  # armv7 and armhf need to build anything (gcc included).
  s0:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s0
          prev: ""
          pkgs: "abuild"

  # Alpine's gcc-gnat lacks two GNAT runtime fixes: the 32-bit musl time64 one
  # (x86, armv7, armhf; gprbuild needs it) and the shared Unbounded strings on
  # s390x and riscv64 (vss needs them).  Until the main/gcc MR is merged, build
  # the carrier aport (testing/gcc) on those targets.
  sg:
    needs: s0
    if: contains('x86 armv7 armhf s390x riscv64', inputs.arch)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: sg
          prev: "s0"
          pkgs: "gcc"
          seed: "true"

  s1:
    needs: [s0, sg]
    if: ${{ needs.s0.result == 'success' && (needs.sg.result == 'success' || needs.sg.result == 'skipped') }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s1
          prev: ${{ contains('x86 armv7 armhf s390x riscv64', inputs.arch) && 'sg' || 's0' }}
          pkgs: "gprbuild bracke-cryptolib bracke-zlib libsodium-ada mustache-ada hbnf imsg-ada xmlada aunit buildabook gnatcoll gnatcoll-db gnatcoll-gmp gnatcoll-iconv spawn vss aws adasat"

  s2:
    needs: s1
    if: ${{ needs.s1.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s2
          prev: "s1"
          pkgs: "py3-e3-core py3-e3-testsuite prettier-ada py3-langkit langkit libadagpr2 libadagpr gnatcoll-projects"

  s3:
    needs: s2
    if: ${{ needs.s2.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s3
          prev: "s2"
          pkgs: "libadalang"

  s4:
    needs: s3
    if: ${{ needs.s3.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s4
          prev: "s3"
          pkgs: "templates-parser vss-extra xdiff libadalang-tools lal-refactor gnatformat ada-markdown gnatdoc"

  s5:
    needs: s4
    if: ${{ needs.s4.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s5
          prev: "s4"
          pkgs: "fswatch ada-libfswatch ada_language_server afl++"

  s6:
    needs: s5
    if: ${{ needs.s5.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage
        with:
          arch: ${{ inputs.arch }}
          platform: ${{ inputs.platform }}
          qemu: ${{ inputs.qemu }}
          stage: s6
          prev: "s5"
          pkgs: "newlisp"

  smoke:
    needs: s6
    if: ${{ needs.s6.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: env
        uses: ./.github/actions/docker-env
        with:
          arch: ${{ inputs.arch }}
          qemu: ${{ inputs.qemu }}
      - uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s6
          path: .work
      - name: Install everything built and smoke-test it
        run: |
          docker run --rm --platform "${{ inputs.platform }}" \
            -v "$PWD/.work/packages":/pkgs:ro -v "$PWD/tools/ci-smoke.sh":/ci-smoke.sh:ro \
            "${{ steps.env.outputs.image }}" sh /ci-smoke.sh

  # Save the cumulative .work (packages, hashes, the CI-only key) for the next run,
  # even when this run failed part-way: take the furthest stage that produced an
  # artifact.  One cache entry per architecture per run (the repo cache is 10 GB).
  save-cache:
    needs: [s0, sg, s1, s2, s3, s4, s5, s6]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - id: d6
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s6
          path: .work
      - id: d5
        if: steps.d6.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s5
          path: .work
      - id: d4
        if: steps.d5.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s4
          path: .work
      - id: d3
        if: steps.d4.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s3
          path: .work
      - id: d2
        if: steps.d3.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s2
          path: .work
      - id: d1
        if: steps.d2.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s1
          path: .work
      - continue-on-error: true
        if: steps.d1.outcome != 'success'
        id: dg
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-sg
          path: .work
      - continue-on-error: true
        if: steps.d1.outcome != 'success' && steps.dg.outcome != 'success'
        id: d0
        uses: actions/download-artifact@v4
        with:
          name: work-${{ inputs.arch }}-s0
          path: .work
      - continue-on-error: true   # nothing to save if no stage produced anything
        uses: actions/cache/save@v4
        with:
          path: .work
          key: work-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
