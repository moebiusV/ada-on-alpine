# Build and test every aport on every architecture Alpine edge supports.
# Every architecture is built by default.  To build fewer, put `[ci only:
# aarch64,x86]` in the commit message (or the "only" input of a manual run).
# A stage that runs out of time checkpoints and ci-resume.yml reruns it
# automatically.  Stages after a skipped one (sg) still run: see build-arch.yml.
# (The 32-bit arches x86, armv7 and armhf are re-run in full whenever the toolchain
# stamp logic in build.sh changes; their caches then rebuild once.)
# x86_64, x86 and aarch64 run natively on GitHub's runners (x86 as a 32-bit
# container on an x86_64 host); the other six run under QEMU user-mode emulation,
# which is slow -- the heavy aports (libadalang, ada_language_server) may exceed
# a runner's limits there, in which case that aport's arch= must exclude the
# architecture.
name: ci

on:
  push:
    branches: [main]
    paths: ['testing/**', 'build.sh', 'tools/**', '.github/**']
  pull_request:
    paths: ['testing/**', 'build.sh', 'tools/**', '.github/**']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated architectures to build (default: all)'
        required: false
        default: ''

# A newer push to a PR supersedes its older run, but never cancel a run on main:
# the emulated architectures take hours and a cancel throws the progress away.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    # Every aport under testing/ must be built by some stage in build-arch.yml,
    # except gpr2-tools (disabled) and gcc (the main/gcc MR carrier: Alpine's
    # own builders build gcc; it is only built here by hand, for testing).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          listed=$(grep -E '^ +pkgs: ' .github/workflows/build-arch.yml | sed 's/.*pkgs: //; s/"//g' | tr ' ' '\n' | sort | grep -vx gcc)
          all=$(ls testing | grep -vxE 'gpr2-tools|gcc' | sort)
          diff <(echo "$listed") <(echo "$all") && echo "all aports covered"

  plan:
    # Choose the architectures to build: all of them, or only those named by
    # `[ci only: a,b]` in the head commit message / the manual-run input.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          MSG: ${{ github.event.head_commit.message }}
          ONLY_INPUT: ${{ github.event.inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          full = [
            {"arch": "x86_64",      "runner": "ubuntu-latest",    "platform": "linux/amd64",   "qemu": False},
            {"arch": "x86",         "runner": "ubuntu-latest",    "platform": "linux/386",     "qemu": False},
            {"arch": "aarch64",     "runner": "ubuntu-24.04-arm", "platform": "linux/arm64",   "qemu": False},
            {"arch": "armv7",       "runner": "ubuntu-24.04-arm", "platform": "linux/arm/v7",  "qemu": True},
            {"arch": "armhf",       "runner": "ubuntu-24.04-arm", "platform": "linux/arm/v6",  "qemu": True},
            {"arch": "ppc64le",     "runner": "ubuntu-latest",    "platform": "linux/ppc64le", "qemu": True},
            {"arch": "s390x",       "runner": "ubuntu-latest",    "platform": "linux/s390x",   "qemu": True},
            {"arch": "riscv64",     "runner": "ubuntu-latest",    "platform": "linux/riscv64", "qemu": True},
            {"arch": "loongarch64", "runner": "ubuntu-latest",    "platform": "linux/loong64", "qemu": True},
          ]
          m = re.search(r"\[ci only: *([^\]]+)\]", os.environ.get("MSG", ""))
          only = (m.group(1) if m else os.environ.get("ONLY_INPUT", "")).replace(" ", "")
          want = [a for a in only.split(",") if a]
          # s390x and riscv64 are off by default until a full run passes.  s390x: a
          # big-endian bug in VSS's Unicode table made three langkit unparsing tests
          # fail (patched in testing/vss, being verified).  riscv64: langkit now builds
          # and passes (alignment patches in langkit and adasat); libadalang takes
          # longer than one job, which the multi-job resume (build.sh run_abuild) is
          # for.  Name them to build them: [ci only: s390x] or [ci only: riscv64].
          off = {"s390x", "riscv64"}
          default = [e for e in full if e["arch"] not in off]
          if want == ["all"]:
              sel = default
          elif want:
              sel = [e for e in full if e["arch"] in want]
          else:
              sel = default
          print("matrix=" + json.dumps({"include": sel}))
          PY

  build:
    needs: [coverage, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      qemu: ${{ matrix.qemu }}
