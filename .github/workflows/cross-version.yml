# Cross-version libsodium CI: build the libsodium-ada binding and run its smoke
# suite against each pinned libsodium release (oldest supported -> latest
# stable), so a binding that accidentally depends on a newer symbol/ABI is
# caught.  Runs inside the ada-toolchain image; publish it first with
# ./publish-image.sh (the image is built locally by ./build-image.sh and is not
# on a registry by default).
name: cross-version

on:
  push:
    paths:
      - 'sources/libsodium-ada/**'
  pull_request:
    paths:
      - 'sources/libsodium-ada/**'
  workflow_dispatch:

jobs:
  cross-version:
    runs-on: ubuntu-latest
    container:
      # Lowercase owner; adjust if the GHCR namespace differs.
      image: ghcr.io/moebiusv/ada-toolchain:edge
    steps:
      - uses: actions/checkout@v4
      - name: Build and test against multiple libsodium versions
        run: sources/libsodium-ada/tools/cross-version.sh
